# Application artifacts: dh-appstore-sync mirrors these onto the
# puppet master (the only machine that talks to the internet) and the
# puppet fileserver serves them to app servers - which therefore need
# no internet. kind pip = wheelhouse tarball of the packages with
# dependencies; kind github = the release tarball of repo. Default is
# the LATEST release (the daily sync follows upstream); pin with
# version: (github tag) or == in packages: (pip) when necessary.
# interval: fast checks every 10 minutes instead of daily - for our
# own repos, so a release is serving within minutes of the tag.
# dh-app-update <app> on the puppet master syncs on demand.
apps:
  puppetboard:
    kind: pip
    packages:
      - puppetboard
      - gunicorn
  # metrics server: the official release tarball, unpacked by
  # dhprometheus on prometheus1
  prometheus:
    kind: github
    repo: prometheus/prometheus
    asset: 'prometheus-*.linux-amd64.tar.gz'
  alertmanager:
    kind: github
    repo: prometheus/alertmanager
    asset: 'alertmanager-*.linux-amd64.tar.gz'
  # per-node proxmox metrics (VMs, storage, cluster) - runs on the
  # pve hosts themselves, read-only PVEAuditor token
  pve-exporter:
    kind: pip
    packages:
      - prometheus-pve-exporter
  # BGP session/prefix metrics from bird (router plan P6): flat
  # release tarball with one static binary, unpacked by
  # dhbirdexporter on the router
  bird-exporter:
    kind: github
    repo: czerwonk/bird_exporter
    asset: 'bird_exporter_*_linux_amd64.tar.gz'
  # mirror-only for now: the MFA portal evaluation (Authelia plan).
  # Upstream ships official .deb release assets; nothing installs
  # this yet - it just exists in the appstore/fileserver.
  authelia:
    kind: github
    repo: authelia/authelia
    asset: 'authelia_*_amd64.deb'
  # the deploy stack itself, served to the deploy server(s) - built
  # straight from the PUBLIC github repo (kind git: the master keeps
  # a bare mirror on the appdisk; pushing github IS the release).
  # deploy-backend = the CGI tree + frontend + lib; deploy-utils =
  # the operator tools (deploy-vm, ipplan2db); deployd = the
  # provisioner daemon. Path-scoped + tree-hash versioned: only
  # commits touching the path release a new artifact.
  deploy-backend:
    kind: git
    repo: https://github.com/dhtech/deploy
    ref: proxmox-revamp
    path: server
    interval: fast
  deploy-utils:
    kind: git
    repo: https://github.com/dhtech/deploy
    ref: proxmox-revamp
    path: utils
    interval: fast
  deployd:
    kind: git
    repo: https://github.com/dhtech/deploy
    ref: proxmox-revamp
    path: deployd
    interval: fast
