#!/usr/sbin/nft -f
# Gen-3 install-time baseline: active before the machine moves to the
# production VLAN. Default-deny inbound; SSH only from the jumpgates;
# outbound open (puppet reaches out on 8140). Puppet replaces this file
# with the full production ruleset on first run.

flush ruleset

define jumpgates = { 10.200.0.2 }

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    ip protocol icmp accept
    meta l4proto ipv6-icmp accept
    tcp dport 22 ip saddr $jumpgates accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
