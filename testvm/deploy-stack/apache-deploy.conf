<VirtualHost *:8080>
  DocumentRoot /var/www

  # Deploy backend CGIs (URL layout matches what dhtech.ipxe and the
  # installer expect)
  ScriptAlias /ipxe-inventory.py /var/www/deploy/ipxe/inventory.py
  ScriptAlias /ipxe-network.py /var/www/deploy/ipxe/network.py
  ScriptAlias /ipxe-register.py /var/www/deploy/ipxe/register.py
  ScriptAlias /ipxe.py /var/www/deploy/ipxe/ipxe.py
  ScriptAlias /provision.py /var/www/deploy/finish.py
  ScriptAlias /interfaces.py /var/www/deploy/debian/interfaces.py

  Alias /preseed /var/www/data/preseed
  Alias /debian-installer /var/www/data/debian-installer

  SetEnv PYTHONPATH /var/www/deploy

  <Directory /var/www>
    Options +ExecCGI +FollowSymLinks
    AddHandler cgi-script .py
    DirectoryIndex index.html
    Require all granted
  </Directory>

  <Directory /var/www/deploy>
    Options +ExecCGI
    Require all granted
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/error.log
  LogLevel warn
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
