[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provisiond"
version = "3.0.0"
description = "Dreamhack deploy VM/hardware provisioner (Proxmox, VMware, C7000, OCP)"
requires-python = ">=3.11"
dependencies = [
    "proxmoxer~=2.2",
    "requests~=2.32",
    "pyvmomi~=8.0",
    "redis~=5.2",
    "hvac~=2.3",
    "PyYAML~=6.0",
    "pyghmi~=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-cov",
    "fakeredis~=2.26",
    "requests-mock~=1.12",
    "mypy~=1.13",
    "ruff~=0.8",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that require the live pve-test environment"]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyvmomi ships no type stubs; its constructors count as untyped calls.
module = ["provisiond.backends.vmware", "provisiond.backends.vcsa"]
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py311"
